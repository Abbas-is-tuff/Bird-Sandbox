<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#c{display:block;position:fixed;inset:0}
#top{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 8px);display:flex;gap:6px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
.tb{width:46px;height:46px;border-radius:13px;border:none;background:rgba(255,255,255,.88);font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.2);padding:0;cursor:pointer}
.tb.on{background:#ffd54a}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:38vw}
#hint,#clock{background:rgba(20,30,45,.75);color:#fff;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:600}
#clock{font-size:13px;align-self:flex-start}
#hint b{color:#ffd54a}
#panel{position:fixed;left:0;right:0;bottom:0;background:rgba(28,38,54,.94);padding:6px calc(env(safe-area-inset-right) + 6px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 6px);z-index:5;touch-action:pan-x}
#tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto}
.tab{padding:7px 16px;border-radius:10px;border:none;background:#3b4a60;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:#ffb300;color:#222}
#items{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}
#items::-webkit-scrollbar{display:none}
.it{flex:0 0 auto;width:72px;height:76px;border-radius:13px;border:2px solid transparent;background:#4a5a72;color:#fff;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;cursor:pointer;font-family:inherit}
.it .ic{font-size:30px;line-height:42px;height:44px}
.it canvas{width:56px;height:46px}
.it.on{border-color:#ffd54a;background:#62779a}
#info{position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 110px);width:220px;background:rgba(24,33,48,.95);color:#fff;border-radius:14px;padding:10px 12px;z-index:7;font-size:13px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#info{touch-action:auto}#info input{-webkit-user-select:text;user-select:text}
#info b{color:#ffd54a}#info .bar{height:7px;border-radius:4px;background:#333;margin:3px 0 7px;overflow:hidden}#info .bar i{display:block;height:100%}
#fireBtn{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:150px;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b5b,#c1121f);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:7;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 -5px 0 rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.85);user-select:none;-webkit-user-select:none;touch-action:none;font-family:system-ui}
#fireBtn b{font-size:18px;letter-spacing:1px}#fireBtn #fireIc{font-size:30px;line-height:1}#fireBtn.on{transform:scale(.92);background:radial-gradient(circle at 35% 30%,#ffb35b,#e2541f)}
#fireX{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:#1c2636;color:#fff;font-style:normal;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(20,30,45,.85);color:#fff;padding:14px 20px;border-radius:16px;font-size:18px;font-weight:700;z-index:9;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
#settings{position:fixed;top:calc(env(safe-area-inset-top) + 64px);right:calc(env(safe-area-inset-right) + 8px);width:min(340px,92vw);max-height:62vh;overflow-y:auto;background:rgba(24,33,48,.97);color:#fff;border-radius:16px;padding:12px 14px 14px;z-index:8;box-shadow:0 8px 30px rgba(0,0,0,.4);touch-action:pan-y;display:none}
#settings.open{display:block}
#settings h3{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
#settings h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9fb3cf}
#settings .row{margin:8px 0}
#settings .lab{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:2px}
#settings .lab span{color:#ffd54a}
#settings input[type=range]{width:100%;accent-color:#ffb300;height:28px;touch-action:pan-x}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 4px;border-radius:9px;border:none;background:#3b4a60;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.seg button.on{background:#ffb300;color:#222}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:4px}
.chk input{width:22px;height:22px;accent-color:#ffb300}
#mapMenu{position:fixed;inset:0;z-index:20;background:rgba(10,16,28,.72);display:none;align-items:center;justify-content:center;touch-action:auto}
.mmBox{background:linear-gradient(#25344c,#1a2436);border-radius:22px;padding:18px;width:min(860px,94vw);max-height:88vh;overflow-y:auto;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center}
.mmTitle{font-size:32px;font-weight:800}.mmLogo{width:min(420px,80%);border-radius:16px;display:block;margin:0 auto 4px;box-shadow:0 6px 18px rgba(0,0,0,.4)}.mmSub{color:#9fb3cf;margin:4px 0 14px;font-weight:600}
.mmGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mmCard{background:#34465f;border:3px solid transparent;border-radius:16px;color:#fff;padding:10px 8px;cursor:pointer;font-family:inherit}
.mmCard.cur{border-color:#ffd54a}.mmCard:active{transform:scale(.97)}
.mmIc{font-size:42px}.mmN{font-weight:800;font-size:15px;margin-top:2px}.mmD{font-size:11.5px;color:#c9d6ea;margin-top:3px}
.mmClose{margin-top:14px;border:none;background:#ffb300;color:#222;font-weight:800;font-size:16px;padding:10px 22px;border-radius:12px;font-family:inherit}
#search{flex:0 0 130px;border:none;border-radius:10px;padding:7px 10px;font-size:15px;font-weight:600;background:#e9eef5;color:#222;-webkit-user-select:text;user-select:text;touch-action:auto;font-family:inherit}
#sClose{border:none;background:#3b4a60;color:#fff;width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer}
.small{font-size:12px;color:#9fb3cf;margin-top:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="hint"></div><div id="clock"></div></div>
<div id="top">
  <button class="tb" id="bMap" title="Maps">🗺️</button>
  <button class="tb" id="bZin" title="Zoom in">➕</button>
  <button class="tb" id="bZout" title="Zoom out">➖</button>
  <button class="tb" id="bHome" title="Back to start">🏠</button>
  <button class="tb" id="bPause" title="Pause">⏸️</button>
  <button class="tb" id="bSlow" title="Slow motion">🐢</button>
  <button class="tb" id="bGrav" title="Gravity">🌍</button>
  <button class="tb" id="bTime" title="Day / Night">🌞</button>
  <button class="tb" id="bWeather" title="Weather">☀️</button>
  <button class="tb on" id="bNames" title="Names">🏷️</button>
  <button class="tb" id="bRain" title="Bird rain">🐦</button>
  <button class="tb" id="bUndo" title="Undo">↩️</button>
  <button class="tb" id="bHeal" title="Revive all">💉</button>
  <button class="tb" id="bClear" title="Clear">🧹</button>
  <button class="tb" id="bSet" title="Settings">⚙️</button>
</div>
<div id="settings">
  <h3>Settings <button id="sClose">✕</button></h3>
  <h4>Physics</h4>
  <div class="row"><div class="lab">Gravity <span id="vGrav"></span></div><input type="range" id="sGrav" min="-1" max="2" step="0.05"></div>
  <div class="row"><div class="lab">Air resistance <span id="vAir"></span></div><input type="range" id="sAir" min="0" max="3" step="0.1"></div>
  <div class="row"><div class="lab">Simulation speed <span id="vSpeed"></span></div><input type="range" id="sSpeed" min="0.1" max="2" step="0.05"></div>
  <div class="row"><div class="lab">Simulation quality</div><div class="seg" id="segQ"><button data-v="low">Low</button><button data-v="medium">Medium</button><button data-v="high">High</button><button data-v="ultra">Ultra</button></div><div class="small">Low = faster on older devices</div></div>
  <h4>Environment</h4>
  <div class="row"><div class="lab">Wind <span id="vWind"></span></div><input type="range" id="sWind" min="-10" max="10" step="0.5"></div>
  <div class="row"><div class="lab">Weather</div><div class="seg" id="segW"><button data-v="clear">☀️ Clear</button><button data-v="rain">🌧️ Rain</button><button data-v="storm">⛈️ Storm</button><button data-v="snow">❄️ Snow</button><button data-v="hail">🧊 Hail</button><button data-v="sand">🏜️ Sand</button></div></div>
  <div class="row"><div class="lab">Day or night</div><div class="seg" id="segT"><button data-v="6.2">🌄 Sunrise</button><button data-v="12">🌞 Day</button><button data-v="17.8">🌅 Sunset</button><button data-v="23">🌙 Night</button></div></div>
  <div class="row"><div class="lab">Time of day <span id="vTime"></span></div><input type="range" id="sTime" min="0" max="24" step="0.1"></div>
  <label class="chk"><input type="checkbox" id="sFlow"> Time passes (1 day = 4 minutes)</label>
  <h4>Your world</h4>
  <div class="seg"><button id="bSave">💾 Save world</button><button id="bLoad">📂 Load world</button></div><div class="small" id="saveMsg">Saves on this device</div>
</div>
<div id="panel">
  <div id="tabs">
    <button class="tab on" data-tab="birds">🐦 Birds</button>
    <button class="tab" data-tab="items">📦 Items</button>
    <button class="tab" data-tab="world">🌳 World</button>
    <button class="tab" data-tab="plants">🌿 Plants</button>

  b.E=pt(-8*wl,6,4.5,'wing',{area:1.2*wl});b.Wt=pt(-15*wl,12+5*wl,4.5,'wing',{area:1.4*wl});b.T=pt(def.tailUp?-15:-8-10*tl,def.tailUp?-6:12*bl+8+10*tl,4,'body',{area:.8});
  b.K1=pt(-4,12*bl+7*ll,3,'leg1');b.F1=pt(-5,12*bl+14*ll,3.5,'leg1',{fric:.6});b.K2=pt(1,12*bl+7*ll,3,'leg2');b.F2=pt(1,12*bl+14*ll,3.5,'leg2',{fric:.6});
  const {U,L,H,Bk,E,Wt,T,K1,F1,K2,F2}=b;
  const j=(a,c,k,joint,min)=>{stick(b,a,c,k);const st=b.st[b.st.length-1];st.j=joint||'';if(min)st.min=true;return st};
  j(U,L,1);j(L,T,1);j(U,T,.25);

  b.wJ=j(U,E,1,'wing');j(L,E,.1,'wing');j(E,Wt,1);j(U,Wt,.06,'wing');

function makePond(cx,w){
  w=clamp(w,90,Math.min(520,Math.max(W,900)*.6));const x=cx-w/2;
  for(const p of ponds)if(x<p.x+p.w+20&&x+w>p.x-20)return null;
  const n=Math.max(4,Math.round(w/8)),cols=[];for(let i=0;i<=n;i++)cols.push({h:0,v:0});
  const pd={x,w,d:Math.max(30,H-panelH()-groundY-8),cols,n};ponds.push(pd);return pd;
}
function surfaceAt(x,y){
  let best=typeof terrainOn!=='undefined'&&terrainOn?gAt(x):groundY;
  for(const w of walls){if(w.trunk||w.pole||w.lampCap||w.ptrunk)continue;if(x<w.x||x>w.x+w.w)continue;if(w.y>=y-30&&w.y<best)best=w.y}
  return best;
}
function snapY(x,y,h){const sb=surfaceAt(x,y);return sb-y<50?sb-h:Math.min(y,typeof terrainOn!=='undefined'&&terrainOn?gAt(x):groundY)-h/2}
function makeTree(x,base=groundY){
  if(typeof terrainOn!=='undefined'&&terrainOn)base=Math.min(base,gAt(x)+2);
  const id=treeId++,h=clamp(base-110,90,270),tx=x;
  const trunk={x:tx-11,y:base-h,w:22,h,trunk:true,tree:id};walls.push(trunk);
  const t={id,x:tx,h,base,branches:[],trunk,leafSeed:Math.random()*1000};trees.push(t);
  for(let k=0;k<3;k++){
    const side=k%2?-1:1,by=base-h*.38-k*h*.2,len=105-k*16,n=13;
    const br=newBody('branch',{tree:id,side,mi:8,bi:4});
    for(let i=0;i<n;i++){
      const px=tx+side*(11+4+i*len/(n-1)),py=by-i*len/(n-1)*.28;
      const p=new P(px,py,i<2?6:5.5-i*.18,br,{im:1,fric:.8,dens:.6,pinned:i<2,area:.7});p.rx=px;p.ry=py;br.ps.push(p);
    }
    for(let i=0;i<n-1;i++)stick(br,br.ps[i],br.ps[i+1]);
    for(let i=0;i<n-2;i++)stick(br,br.ps[i],br.ps[i+2],.35);
    add(br);t.branches.push(br);
  }
  return t;
}
function removeTree(id){
  walls=walls.filter(w=>w.tree!==id);
  for(const b of bodies)if(b.tree===id)b.dead=true;

}

function makeFurniture(kind,x,y){
  const b=newBody('furn',{kind,groups:{},anchor:{},att:{}});
  const Q=(px,py,r,g)=>{const p=new P(px,py,r,b,{im:.9,fric:.5,dens:.6});b.ps.push(p);(b.groups[g]=b.groups[g]||[]).push(p);return p};
  if(kind==='table'){
    for(let i=0;i<6;i++)Q(x-35+i*14,y-22,6,'top');
    for(const sd of [-1,1])for(let i=0;i<3;i++)Q(x+sd*32,y-8+i*15,5,sd<0?'legL':'legR');
    b.anchor={legL:b.groups.top[0],legR:b.groups.top[5]};
  } else {
    for(let i=0;i<3;i++)Q(x-12+i*12,y,5,'seat');
    for(let i=0;i<3;i++)Q(x-14-i*.8,y-14-i*14,4.5,'back');
    for(const sd of [-1,1])for(let i=0;i<2;i++)Q(x+sd*12,y+13+i*13,4.5,sd<0?'legL':'legR');
    b.anchor={back:b.groups.seat[0],legL:b.groups.seat[0],legR:b.groups.seat[2]};
  }
  for(const g in b.groups){const a=b.groups[g];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)stick(b,a[i],a[j])}
  const main=b.groups.top||b.groups.seat;
  for(const g in b.anchor){b.att[g]=true;for(const p of b.groups[g])for(const q of main){stick(b,p,q);b.st[b.st.length-1].j=g}}

function breakJoint(b,g){

  const grp=b.groups[g],inG=new Set(grp);

  piece.st=b.st.filter(st=>inG.has(st.a)&&inG.has(st.b));
  b.st=b.st.filter(st=>!inG.has(st.a)&&!inG.has(st.b));
  for(const p of grp){p.body=piece;piece.ps.push(p)}
  b.ps=b.ps.filter(p=>!inG.has(p));delete b.groups[g];delete b.anchor[g];
  add(piece);
  const c=centroid(piece);for(let i=0;i<6;i++)fx.push({t:'splinter',x:c.x,y:c.y,vx:rand(-3,3),vy:rand(-4,0),rot:rand(0,TAU),vr:rand(-.3,.3),life:1});

}

function buildPairs(){

    const p=allP[i];p.i=i;if(p.noCol)continue;

  }
  for(const p of allP){
    if(p.noCol)continue;
    const cx=Math.floor(p.x/cell)+200,cy=Math.floor(p.y/cell)+200;
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const a=map.get((cx+ox)*100000+cy+oy);if(!a)continue;
      for(const q of a){

}

  if(!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=getNoise();f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

function startAmbience(){
  const mk=(type,freq,q)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=getNoise();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.value=0;s.connect(f).connect(g).connect(AC.destination);s.start();return{g,f}};
  amb={rain:mk('lowpass',2200,.5),wind:mk('bandpass',320,.6)};
}
let cricketT=0,birdAmbT=3;
function updateAmbience(sec){
  if(!AC||!amb)return;const t=AC.currentTime;
  const rv=S.weather==='rain'?.13:S.weather==='storm'?.22:S.weather==='hail'?.08:0;// snow is silent
  amb.rain.g.gain.setTargetAtTime(paused?0:rv,t,.5);

  amb.wind.g.gain.setTargetAtTime(paused?0:wv,t,.3);amb.wind.f.frequency.setTargetAtTime(250+Math.abs(windNow)*25,t,.3);

}

function circle(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill()}
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function mix(a,b,t){const A=hex(a),B=hex(b);return`rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`}
function shade(h,amt){const[r,g,b]=hex(h);const f=v=>clamp(Math.round(amt<0?v*(1+amt):v+(255-v)*amt),0,255);return'#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawWing(c,b,col,off){
  const {U,E,Wt,s,f}=b,def=lookDef(b);if(!b.att.wing&&E.body!==b&&E.body.dead)return;

  let dx=Wt.x-Sx,dy=Wt.y-Sy;const dl=Math.hypot(dx,dy)||1;const nx=-dy/dl*f,ny=dx/dl*f;
  const ox=-nx*off,oy=-ny*off;

  c.quadraticCurveTo(E.x-nx*8*s+ox,E.y-ny*8*s+oy,Wt.x+ox,Wt.y+oy);
  c.quadraticCurveTo(E.x+nx*4*s+ox,E.y+ny*4*s+oy,Sx+ox,Sy+oy);c.fill();

  if(def.bars&&!off){c.strokeStyle=def.bars;c.lineWidth=2*s;c.beginPath();for(const t of [.38,.55]){const mx=lerp(Sx,Wt.x,t),my=lerp(Sy,Wt.y,t);c.moveTo(mx-nx*4*s,my-ny*4*s);c.lineTo(mx+nx*3*s,my+ny*3*s)}c.stroke()}

  c.stroke();

    }

    b.burnt=(b.burnt||0)+sec/14*b.fire;

/* =================== FREEZE =================== */
function freezeBody(b){
  if(!b||b.dead||b.type==='branch'||b.type==='anchor'||b.frozenT>0)return;
  b.frozenT=15;b.fire=0;b.iceSt=[];b.oldFric=b.ps.map(p=>p.fric);
  const ps=b.ps.filter(p=>!p.pinned),n=ps.length;
  for(let i=0;i<n;i++)for(let j=i+1;j<n&&(n<=14||j<=i+4);j++){stick(b,ps[i],ps[j]);b.iceSt.push(b.st[b.st.length-1])}
  for(const p of b.ps)p.fric=.03;
  if(b.type==='bird'){b.flyT=0;b.goal=null;b.sleep=false;b.toyGo=null}
  const c=centroid(b);noise(.3,.25,6000,'highpass',c.x);tone('sine',2400,1800,.3,.04,1500,c.x);
}
function unfreeze(b,shatter){
  if(!(b.frozenT>0))return;b.frozenT=0;
  const set=new Set(b.iceSt||[]);b.st=b.st.filter(s=>!set.has(s));b.iceSt=null;
  b.ps.forEach((p,i)=>{if(b.oldFric&&b.oldFric[i]!==undefined)p.fric=b.oldFric[i]});
  const c=centroid(b);
  if(shatter){for(let i=0;i<14;i++)fx.push({t:'shardfx',x:c.x+rand(-15,15),y:c.y+rand(-15,15),vx:rand(-4,4),vy:rand(-5,1),rot:rand(0,TAU),vr:rand(-.3,.3),life:1});glassShatter(c.x)}
  else for(let i=0;i<8;i++)fx.push({t:'drop',x:c.x+rand(-15,15),y:c.y+rand(-10,10),vx:rand(-1,1),vy:rand(-1,0),life:.8});
  if(b.type==='bird'&&b.alive){b.stun=Math.max(b.stun,1.2);b.shiverT=5}
}
function updateFrozen(dt){
  const sec=dt/60;
  for(const b of bodies){if(!(b.frozenT>0))continue;
    let rate=temp<0?.3:1;
    if(burnList.length){const c=centroid(b);for(const q of burnList)if(Math.hypot(q.x-c.x,q.y-c.y)<90){rate=6;break}}
    b.frozenT-=sec*rate;if(b.frozenT<=0){b.frozenT=.001;unfreeze(b,false)}
  }
}

function makePlant(kind,x,base,o={}){
  if(typeof terrainOn!=='undefined'&&terrainOn)base=Math.min(base,gAt(x)+2);
  const pl=Object.assign({kind,x,base,seed:Math.random()*1000,t:rand(5,12),walls:[]},o);
  const wall=w=>{w.plant=true;w.pl=pl;walls.push(w);pl.walls.push(w);return w};
  switch(kind){
    case 'flower':pl.cols=Array.from({length:3},()=>['#ff4d6d','#ffd23f','#b388ff','#ff8fab','#4cc9f0','#ffffff'][(Math.random()*6)|0]);pl.hts=[rand(24,34),rand(30,44),rand(22,32)];break;
    case 'sunflower':pl.h=rand(85,110);break;
    case 'berrybush':pl.berries=4;break;
    case 'appletree':{const t=makeTree(x,base);t.apple=true;pl.tree=t;pl.apples=Array.from({length:6},(_,i)=>({u:rand(-.5,.5),v:rand(-.6,.3),ripe:rand(0,1)}));break}
    case 'palm':pl.h=clamp(base-120,120,230);pl.lean=Math.random()<.5?-1:1;pl.nuts=3;
      wall({x:x-7,y:base-pl.h,w:14,h:pl.h,ptrunk:true});wall({x:x+pl.lean*18-18,y:base-pl.h-4,w:36,h:6,lampCap:true,ptop:true});break;
    case 'pine':pl.h=clamp(base-90,130,260);wall({x:x-7,y:base-pl.h*.55,w:14,h:pl.h*.55,ptrunk:true});break;
    case 'cactus':pl.h=rand(70,95);pl.arm=Math.random()<.5?-1:1;
      wall({x:x-10,y:base-pl.h,w:20,h:pl.h,cactus:true});wall({x:x+pl.arm*10+(pl.arm<0?-20:0),y:base-pl.h*.55,w:20,h:12,cactus:true});break;
    case 'mushroom':wall({x:x-7,y:base-38,w:14,h:38});wall({x:x-38,y:base-54,w:76,h:16,tramp:true,mush:true});break;
    case 'tallgrass':case 'reeds':break;
    case 'hoop':{const top=Math.max(60,base-175),d=x<(VX0+VX1)/2?1:-1;pl.top=top;pl.dir=d;pl.score=0;
      wall({x:x-4,y:top-34,w:8,h:base-top+34,ptrunk:true});
      wall({x:x+d*6-(d<0?6:0),y:top-46,w:6,h:56});
      pl.rx0=x+d*12;pl.rx1=x+d*56;
      wall({x:(d>0?pl.rx1:pl.rx1-6),y:top-3,w:6,h:6,rim:true});break}
  }
  plants.push(pl);return pl;
}
function removePlant(pl){
  walls=walls.filter(w=>w.pl!==pl);plants=plants.filter(p=>p!==pl);
  if(pl.tree)removeTree(pl.tree.id);
}
function deletePlantAt(x,y){
  for(const pl of [...plants].reverse()){
    const hgt=pl.kind==='palm'||pl.kind==='pine'?pl.h+40:pl.kind==='hoop'?pl.base-pl.top+60:pl.kind==='sunflower'?pl.h+20:pl.kind==='cactus'?pl.h:pl.kind==='appletree'?0:60;
    if(Math.abs(x-pl.x)<(pl.kind==='hoop'?60:30)&&y>pl.base-hgt&&y<pl.base+15){removePlant(pl);return true}
  }
  return false;
}

function natureActivate(b,x,y){

    case 'animal':if(b.alive){animalSound(b);animalJump(b,0,4);if(b.def.cat)purr(b.C.x);fx.push({t:'heart',x:b.Hd.x,y:b.Hd.y-20,vy:-1,life:1});b.stun=0}return true;
    case 'bubbler':b.on=!b.on;toast(b.on?'🫧 Bubbles on':'Bubbles off');tone('square',500,300,.08,.04,null,x);return true;
    case 'hab':b.burner=!b.burner;toast(b.burner?'🔥 Burner on — up we go!':'Burner off');noise(.4,.12,700,'lowpass',x);return true;
    case 'habenv':if(b.basket&&!b.basket.dead)return natureActivate(b.basket,x,y);return true;
    case 'chime':ringChime(b,true);addVel(b.ps[0],rand(-3,3),0);return true;

/* ---- extra contact physics: friction, bounce and resting ---- */
function pairResponse(dt){
  for(let i=0;i<pairs.length;i+=2){
    const a=pairs[i],b=pairs[i+1],dx=b.x-a.x,dy=b.y-a.y,mr=a.r+b.r+.6,d2=dx*dx+dy*dy;
    if(d2>=mr*mr||d2<1e-9)continue;
    const ab=a.body.type==='bird',bb=b.body.type==='bird';if((ab||a.body.type==='animal')&&(bb||b.body.type==='animal'))continue;
    const wa=(a.pinned||a.body.held)?0:a.im,wb=(b.pinned||b.body.held)?0:b.im,w=wa+wb;if(!w)continue;
    const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
    const rvx=(b.x-b.px)-(a.x-a.px),rvy=(b.y-b.py)-(a.y-a.py),vn=rvx*nx+rvy*ny;
    const v0n=((b.vx0-a.vx0)*nx+(b.vy0-a.vy0)*ny)*dt;
    let jn=0;
    if(v0n<-1.5*dt){let e=Math.max(a.rest,b.rest);if(ab||bb)e*=.3;const want=-v0n*e;if(vn<want)jn=want-vn}
    const tx=rvx-vn*nx,ty=rvy-vn*ny,k=Math.min(.9,Math.sqrt(a.fric*b.fric)*1.2);
    const ix=jn*nx-tx*k,iy=jn*ny-ty*k;
    a.px+=ix*wa/w;a.py+=iy*wa/w;b.px-=ix*wb/w;b.py-=iy*wb/w;
  }
}
const NOREST=new Set(['car','bird','branch','balloon','kite','hab','habenv','anchor','bell','chime','firework','rocket','cart','boat']);
function restDamp(dt){
  const th=.05*dt;
  for(const b of bodies){
    if(NOREST.has(b.type)||b.held||b.dragT||b.fire>0){b.restN=0;continue}
    let touching=false,slow=true;
    for(const p of b.ps){if(p.touch)touching=true;if(Math.abs(p.x-p.px)>th||Math.abs(p.y-p.py)>th){slow=false;break}}
    if(touching&&slow){b.restN=(b.restN||0)+1;if(b.restN>20)for(const p of b.ps){p.px=p.x;p.py=p.y}}else b.restN=0;
  }
}

const GRID=20;
function buildTop(x,w,y){ // highest surface under a footprint (walls + blocks)
  let best=surfaceAt(x,y);
  for(const b of bodies){if(b.type!=='block'&&b.type!=='crate'&&b.type!=='barrel'&&b.type!=='furn')continue;
    for(const p of b.ps)if(Math.abs(p.x-x)<w/2+p.r*.6&&p.y-p.r<best&&p.y>y-60)best=p.y-p.r}
  return best;
}
function makeBlock(kind,x,y){
  const m=MATS[kind];
  if(m.roof){const b=newBody('block',{mat:kind,hp:m.hp});const r=m.r;
    const rows=[5,3,1];let yy=y;for(let j=0;j<3;j++){for(let i=0;i<rows[j];i++)b.ps.push(new P(x+(i-(rows[j]-1)/2)*2*r,yy,r,b,m.o));yy-=r*1.75}
    for(let i=0;i<b.ps.length;i++)for(let j=i+1;j<b.ps.length;j++)stick(b,b.ps[i],b.ps[j]);return b}
  const b=rigid('block',x,y,m.cols,m.rows,m.r,m.o,{mat:kind,hp:m.hp});return b;
}

  const set=new Set(parts.filter(p=>b.ps.includes(p)));if(!set.size)return;
  const lb=newBody('limb',{owner:b,kind,born:frameNo});
  lb.st=b.st.filter(st=>set.has(st.a)&&set.has(st.b));b.st=b.st.filter(st=>!set.has(st.a)&&!set.has(st.b));
  for(const p of set){p.body=lb;lb.ps.push(p)}b.ps=b.ps.filter(p=>!set.has(p));add(lb);

function bigVoice(b){
  const d=b.def,x=b.Hd.x;
  if(d.growl){tone('sawtooth',110,80,.5,.07,140,x);noise(.5,.08,300,'lowpass',x);return true}
  if(d.roar){tone('sawtooth',160,70,.9,.09,220,x);noise(.9,.12,500,'lowpass',x);return true}
  if(d.moo){tone('sawtooth',170,140,.9,.07,260,x);return true}
  if(d.neigh){for(let i=0;i<5;i++)tone('sawtooth',900-i*90,700-i*90,.12,.04,800,x,i*.1);return true}
  if(d.trumpet){tone('sawtooth',420,640,.6,.07,900,x);tone('square',430,620,.6,.03,800,x);return true}
  if(d.howl){tone('sine',380,620,.8,.06,null,x);tone('sine',620,420,.7,.05,null,x,.8);return true}
  if(d.chatter){for(let i=0;i<6;i++)tone('square',1400+Math.random()*500,1100,.05,.03,null,x,i*.07);return true}
  return false;
}

// first thing along a ray (bodies, walls, ground)
function rayHit(x,y,ux,uy,R,skip){
  let best=R,hp=null;
  for(const b of bodies){if(b.dead||skip.has(b)||b.type==='anchor')continue;
    for(const p of b.ps){if(p.noCol)continue;const dx=p.x-x,dy=p.y-y,t=dx*ux+dy*uy;if(t<0||t>best)continue;const perp=Math.abs(dx*uy-dy*ux);if(perp>p.r+1.5)continue;
      const tt=t-Math.sqrt(Math.max(0,(p.r+1.5)**2-perp*perp));if(tt<best){best=Math.max(0,tt);hp=p}}}
  for(const w of walls){ // slab test
    let t0=0,t1=best;for(const [o,u,lo,hi] of [[x,ux,w.x,w.x+w.w],[y,uy,w.y,w.y+w.h]]){if(Math.abs(u)<1e-9){if(o<lo||o>hi){t0=1;t1=0}continue}let a=(lo-o)/u,c=(hi-o)/u;if(a>c)[a,c]=[c,a];t0=Math.max(t0,a);t1=Math.min(t1,c)}
    if(t0<=t1&&t0<best&&t0>0){best=t0;hp=null}}

  if(terrainOn)for(let t=6;t<best;t+=6){if(y+uy*t>gAt(x+ux*t)){best=t;hp=null;break}}
  return{t:best,p:hp,x:x+ux*best,y:y+uy*best};
}

function gunUpdate(dt){

    b.cd=Math.max(0,b.cd-dt);b.dropT=Math.max(0,b.dropT-sec);
    if(b.firing&&g.auto&&(!b.holder||frameNo%6||clearShot(b)))fireGun(b);
    const h=b.holder;
    if(h&&(h.dead||!h.alive||!bodies.includes(h)||b.dragT||h.frozenT>0)){b.holder=null;b.dropT=2;b.firing=false;b.hAng=undefined}
    else if(h){const hp=swordHand(h),f=h.f||1;const gx=hp.x+f*3,gy=hp.y+3;
      // held firmly in the beak/paws: no weight, aimed where the holder looks (or at whoever they're mad at)
      let want=f>0?-.05:Math.PI+.05;const foe=h.foe&&h.foe.alive?h.foe:null;if(foe){const q=cPos(foe);want=Math.atan2(q.y-gy,q.x-gx);h.f=q.x>gx?1:-1}
      if(b.hAng===undefined)b.hAng=Math.atan2(ps[ps.length-1].y-grip.y,ps[ps.length-1].x-grip.x);
      let da=want-b.hAng;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;b.hAng+=da*Math.min(1,.15*dt)+(b.kickA||0);b.kickA=(b.kickA||0)*.8;
      const cs=Math.cos(b.hAng),sn=Math.sin(b.hAng),sp=11,[hvx,hvy]=[hp.x-(hp.px??hp.x),hp.y-(hp.py??hp.y)];
      ps.forEach((p,i)=>{p.x=gx+cs*sp*i;p.y=gy+sn*sp*i;p.px=p.x-hvx;p.py=p.y-hvy});
      b.shootT-=sec;
      if(b.shootT<=0&&h.stun<=0){if(!clearShot(b)){b.firing=false;b.shootT=rand(.3,.8)}else if(g.auto){b.firing=!b.firing;b.shootT=b.firing?rand(.25,.7):rand(2,4.5)}else{fireGun(b);b.shootT=rand(1,2.8)}}
    }
    else if(b.dropT<=0&&!b.dragT){
      for(const o of bodies){if((o.type!=='bird'&&o.type!=='animal')||!o.alive||o.dragT||o.stun>0)continue;const hp=swordHand(o);if(!hp)continue;
        if(Math.hypot(hp.x-grip.x,hp.y-grip.y)<30&&Math.hypot(grip.x-grip.px,grip.y-grip.py)<8*dt){if(bodies.some(q=>(q.type==='sword'||q.type==='gun')&&q.holder===o))continue;b.holder=o;b.shootT=rand(.6,1.5);

    }
  }
  xplUpdate(dt);gunUI();
}

      }
    }
    if(b.stuck&&b.stuck!=='ground'&&(b.stuck.dead||!bodies.includes(b.stuck))){b.st=b.st.filter(s=>!s.glue);b.stuck=null;b.imp=null}
    if(b.stuck&&b.stuck!=='ground'&&b.dragT){b.st=b.st.filter(s=>!s.glue);b.stuck=null;b.imp=null}
    if(b.fuse!==undefined&&b.lit){b.fuse-=dt;
      if(b.kind==='nuke'&&Math.floor((b.fuse+dt)/60)!==Math.floor(b.fuse/60)&&b.fuse>0)tone('square',880,880,.15,.05,null,p0.x);
      if(frameNo%4===0){const tp=b.ps[b.ps.length-1];fx.push({t:'spark',x:tp.x+rand(-2,2),y:tp.y-p0.r-4,vx:rand(-1,1),vy:-rand(1,2),life:.3,col:Math.random()<.5?'#ffd23f':'#ff7b29'})}
      if(b.fuse<=0){xplBlow(b);continue}}
    // land mine

      if(b.armed&&!b.dragT){const c=centroid(b);for(const o of bodies){if(o===b||o.dead||o.type==='branch'||o.type==='anchor'||o.type==='xpl')continue;let hit=false;

        if(frameNo%2===0)fx.push({t:'smoke',x:p0.x-Math.cos(b.angle)*10,y:p0.y-Math.sin(b.angle)*10,vx:rand(-.5,.5),vy:rand(-.5,.5),life:.7,s:rand(4,8)})}

const INJ={broken:{n:'Broken bone',ic:'🦴',t:75,verb:'broke'},torn:{n:'Torn ligament',ic:'🩹',t:45,verb:'tore a ligament in'},disl:{n:'Dislocated joint',ic:'💢',t:30,verb:'dislocated'}};

  else if(type==='disl'){tone('sine',300,900,.07,.07,null,q.x);tone('sine',200,120,.08,.05,null,q.x,.06)}

  fx.push({t:'text',x:q.x,y:q.y-34,vy:-.6,life:1.6,txt:INJ[type].ic+' '+cName(b)+' '+INJ[type].verb+' '+(type==='broken'?'a':'their')+' '+PART_NAME[part]+'!'});

}

function injuryCheck(b,mx){
