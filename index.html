    blinkT:rand(1,4),blink:0,act:'idle',actT:rand(.5,2),look:0,thirst:rand(0,.6),sleep:false,replyT:0,wetT:0,wph:0,drinkT:0,

  b.E=pt(-8*wl,6,4.5,'wing',{area:1.2*wl});b.Wt=pt(-15*wl,12+5*wl,4.5,'wing',{area:1.4*wl});b.T=pt(def.tailUp?-15:-8-10*tl,def.tailUp?-6:12*bl+8+10*tl,4,'body',{area:.8});
  b.K1=pt(-4,12*bl+7*ll,3,'leg1');b.F1=pt(-5,12*bl+14*ll,3.5,'leg1',{fric:.6});b.K2=pt(1,12*bl+7*ll,3,'leg2');b.F2=pt(1,12*bl+14*ll,3.5,'leg2',{fric:.6});
  const {U,L,H,Bk,E,Wt,T,K1,F1,K2,F2}=b;
  const j=(a,c,k,joint,min)=>{stick(b,a,c,k);const st=b.st[b.st.length-1];st.j=joint||'';if(min)st.min=true;return st};
  j(U,L,1);j(L,T,1);j(U,T,.25);

  b.wJ=j(U,E,1,'wing');j(L,E,.1,'wing');j(E,Wt,1);j(U,Wt,.06,'wing');

function breakLimb(b,name){
  if(!b.att[name])return;b.att[name]=false;

  const p=name==='wing'?b.E:name==='leg1'?b.K1:b.K2;
  detachParts(b,name==='wing'?[b.E,b.Wt]:name==='leg1'?[b.K1,b.F1]:[b.K2,b.F2],'bird');

}
function rigid(type,x,y,cols,rows,r,o={},extra={}){
  const b=newBody(type,Object.assign({cols,rows,r},extra));
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)b.ps.push(new P(x+(i-(cols-1)/2)*2*r,y+(j-(rows-1)/2)*2*r,r,b,o));
  for(let i=0;i<b.ps.length;i++)for(let j=i+1;j<b.ps.length;j++)stick(b,b.ps[i],b.ps[j]);
  return b;
}
function single(type,x,y,r,o={},extra={}){const b=newBody(type,extra);b.ps.push(new P(x,y,r,b,o));return b}

function makePond(cx,w){
  w=clamp(w,90,Math.min(520,W*.6));const x=clamp(cx-w/2,10,W-w-10);
  for(const p of ponds)if(x<p.x+p.w+20&&x+w>p.x-20)return null;
  const n=Math.max(4,Math.round(w/8)),cols=[];for(let i=0;i<=n;i++)cols.push({h:0,v:0});
  const pd={x,w,d:Math.max(30,H-panelH()-groundY-8),cols,n};ponds.push(pd);return pd;
}
function surfaceAt(x,y){
  let best=groundY;
  for(const w of walls){if(w.trunk||w.pole||w.lampCap||w.ptrunk)continue;if(x<w.x||x>w.x+w.w)continue;if(w.y>=y-30&&w.y<best)best=w.y}
  return best;
}
function snapY(x,y,h){const sb=surfaceAt(x,y);return sb-y<50?sb-h:Math.min(y,groundY)-h/2}
function makeTree(x,base=groundY){
  const id=treeId++,h=clamp(base-110,90,270),tx=clamp(x,40,W-40);
  const trunk={x:tx-11,y:base-h,w:22,h,trunk:true,tree:id};walls.push(trunk);
  const t={id,x:tx,h,base,branches:[],trunk,leafSeed:Math.random()*1000};trees.push(t);
  for(let k=0;k<3;k++){
    const side=k%2?-1:1,by=base-h*.38-k*h*.2,len=105-k*16,n=13;
    const br=newBody('branch',{tree:id,side,mi:8,bi:4});
    for(let i=0;i<n;i++){
      const px=tx+side*(11+4+i*len/(n-1)),py=by-i*len/(n-1)*.28;
      const p=new P(px,py,i<2?6:5.5-i*.18,br,{im:1,fric:.8,dens:.6,pinned:i<2,area:.7});p.rx=px;p.ry=py;br.ps.push(p);
    }
    for(let i=0;i<n-1;i++)stick(br,br.ps[i],br.ps[i+1]);
    for(let i=0;i<n-2;i++)stick(br,br.ps[i],br.ps[i+2],.35);
    add(br);t.branches.push(br);
  }
  return t;
}
function removeTree(id){
  walls=walls.filter(w=>w.tree!==id);
  for(const b of bodies)if(b.tree===id)b.dead=true;
  trees=trees.filter(t=>t.id!==id);cleanup();
}

function makeFurniture(kind,x,y){
  const b=newBody('furn',{kind,groups:{},anchor:{},att:{}});
  const Q=(px,py,r,g)=>{const p=new P(px,py,r,b,{im:.9,fric:.5,dens:.6});b.ps.push(p);(b.groups[g]=b.groups[g]||[]).push(p);return p};
  if(kind==='table'){
    for(let i=0;i<6;i++)Q(x-35+i*14,y-22,6,'top');
    for(const sd of [-1,1])for(let i=0;i<3;i++)Q(x+sd*32,y-8+i*15,5,sd<0?'legL':'legR');
    b.anchor={legL:b.groups.top[0],legR:b.groups.top[5]};
  } else {
    for(let i=0;i<3;i++)Q(x-12+i*12,y,5,'seat');
    for(let i=0;i<3;i++)Q(x-14-i*.8,y-14-i*14,4.5,'back');
    for(const sd of [-1,1])for(let i=0;i<2;i++)Q(x+sd*12,y+13+i*13,4.5,sd<0?'legL':'legR');
    b.anchor={back:b.groups.seat[0],legL:b.groups.seat[0],legR:b.groups.seat[2]};
  }
  for(const g in b.groups){const a=b.groups[g];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)stick(b,a[i],a[j])}
  const main=b.groups.top||b.groups.seat;
  for(const g in b.anchor){b.att[g]=true;for(const p of b.groups[g])for(const q of main){stick(b,p,q);b.st[b.st.length-1].j=g}}
  return b;
}
function breakJoint(b,g){
  if(!b.att[g])return;b.att[g]=false;
  const grp=b.groups[g],inG=new Set(grp);
  const piece=newBody('piece',{w:grp[0].r*2});
  piece.st=b.st.filter(st=>inG.has(st.a)&&inG.has(st.b));
  b.st=b.st.filter(st=>!inG.has(st.a)&&!inG.has(st.b));
  for(const p of grp){p.body=piece;piece.ps.push(p)}
  b.ps=b.ps.filter(p=>!inG.has(p));delete b.groups[g];delete b.anchor[g];
  add(piece);
  const c=centroid(piece);for(let i=0;i<6;i++)fx.push({t:'splinter',x:c.x,y:c.y,vx:rand(-3,3),vy:rand(-4,0),rot:rand(0,TAU),vr:rand(-.3,.3),life:1});
  woodCrack(c.x,.8);
}
function breakBranch(br){
  if(br.broken)return;br.broken=true;
  const lo=new Set(br.ps.slice(0,br.bi));
  br.st=br.st.filter(st=>lo.has(st.a)===lo.has(st.b));
  for(let i=br.bi;i<br.ps.length;i++)br.ps[i].free=true;
  const p=br.ps[br.bi];for(let i=0;i<10;i++)fx.push({t:'splinter',x:p.x,y:p.y,vx:rand(-3,3),vy:rand(-4,0),rot:rand(0,TAU),vr:rand(-.3,.3),life:1});
  woodCrack(p.x,1);
  for(const b of bodies)if(b.type==='bird'&&b.goal&&b.goal.br===br)b.goal=null;
}

function makeCart(x,y){
  const b=newBody('cart',{motor:0,wa:0});
  for(let i=0;i<4;i++)b.ps.push(new P(x-27+i*18,y,8,b,{im:.6,fric:.4,dens:.5}));
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)stick(b,b.ps[i],b.ps[j]);
  b.w1=new P(x-25,y+18,11,b,{im:.7,fric:.04,rest:.1,dens:.6});b.w2=new P(x+25,y+18,11,b,{im:.7,fric:.04,rest:.1,dens:.6});
  b.ps.push(b.w1,b.w2);
  for(const w of [b.w1,b.w2]){const near=w===b.w1?[0,1]:[2,3];for(const i of near)stick(b,w,b.ps[i],.7);stick(b,w,b.ps[w===b.w1?3:0],.4)}
  stick(b,b.w1,b.w2,.8);

}
function makeFan(x,y,dir){const b=rigid('fan',x,y,1,2,11,{im:.25,fric:.8,dens:2},{on:true,dir,ang:0});return b}
function makeCannon(x,y,dir){
  const b=newBody('cannon',{dir});
  const pv=new P(x,y-8,7,b,{im:.2,fric:.6,dens:3}),mz=new P(x+dir*Math.cos(.6)*30,y-8-Math.sin(.6)*30,7,b,{im:.3,fric:.5,dens:3});

  b.ps.push(pv,mz,w1,w2);for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)stick(b,b.ps[i],b.ps[j]);return b;
}
function fireCannon(b){
  const [base,mz]=b.ps;const dx=mz.x-base.x,dy=mz.y-base.y,d=Math.hypot(dx,dy)||1;

  addVel(ball.ps[0],dx/d*26,dy/d*26);for(const q of b.ps)addVel(q,-dx/d*2.2,-dy/d*1.2);
  for(let i=0;i<10;i++)fx.push({t:'smoke',x:mz.x+dx/d*14,y:mz.y+dy/d*14,vx:dx/d*rand(1,4)+rand(-1,1),vy:dy/d*rand(1,4)+rand(-1,1),life:.8,s:rand(6,14)});

function launchFirework(b){if(b.launched)return;b.launched=true;b.burn=70;tone('sawtooth',300,1400,.9,.03,1800,b.ps[0].x);noise(.9,.12,2500,'highpass',b.ps[0].x)}

function makeSeesaw(x,y){

let houses=[];
function makeHouse(x,base=groundY){
  const y=base-clamp(base-60,40,150);const h={x,y,base,occ:[]};houses.push(h);
  h.pole={x:x-4,y:y+22,w:8,h:base-y-22,pole:true,house:h};walls.push(h.pole);
  h.roof={x:x-26,y:y-30,w:52,h:7,roof:true,house:h};walls.push(h.roof);
  return h;
}
function removeHouse(h){for(const b of [...h.occ])exitHouse(h,b);walls=walls.filter(w=>w.house!==h);houses=houses.filter(x=>x!==h)}
function enterHouse(h,b){
  if(h.occ.length>=3)return false;h.occ.push(b);b.dead=true;b.inHouse=h;b.goal=null;b.flyT=0;b.act='idle';
  for(const [k,d] of drags)if(d.p.body===b)drags.delete(k);
  return true;
}
function exitHouse(h,b){
  h.occ=h.occ.filter(o=>o!==b);b.inHouse=null;b.dead=false;b.sleep=false;
  const dx=h.x+b.f*20-b.U.x,dy=h.y+4-b.U.y;for(const p of b.ps){p.x+=dx;p.y+=dy;p.px=p.x;p.py=p.y;p.lvx=p.lvy=0}
  b.born=frameNo;add(b);birdCall(b);
}
function needShelter(b){return(b.def.nocturnal?light>.55:light<.25)||S.weather!=='clear'}
function updateHouses(dt){
  for(const h of houses)for(const b of [...h.occ]){
    b.health=Math.min(100,b.health+dt*.02);b.thirst+=dt/60/70;
    if(!needShelter(b)&&Math.random()<.004*dt)exitHouse(h,b);
  }
}
function activate(b,x,y){
  if(natureActivate(b,x,y))return true;
  switch(b.type){
    case 'cart':b.motor=b.motor===0?1:b.motor===1?-1:0;toast(['🚗 Motor off','🚗 Driving →','🚗 ← Driving'][b.motor===0?0:b.motor===1?1:2]);tone('square',220,330,.12,.05,300,x);return true;
    case 'fan':b.on=!b.on;toast(b.on?'🌀 Fan on':'Fan off');tone('square',300,200,.08,.05,null,x);return true;
    case 'cannon':fireCannon(b);return true;
    case 'firework':launchFirework(b);return true;
    case 'bomb':b.fuse=Math.min(b.fuse,30);return true;
    case 'tnt':if(!b.fuse)b.fuse=60;return true;
    case 'balloon':popBalloon(b);return true;
    case 'rocket':launchRocket(b);return true;
    case 'boat':b.motor=b.motor===0?1:b.motor===1?-1:0;toast(['⛵ Motor off','⛵ Sailing →','⛵ ← Sailing'][b.motor===0?0:b.motor===1?1:2]);return true;
    case 'duck':squeak(x);addVel(b.ps[0],rand(-2,2),-5);return true;
    case 'bell':ringBell(b,true);addVel(b.ps[0],rand(-4,4),0);return true;
    case 'pinata':b.hp-=35;addVel(b.ps[0],rand(-6,6),-2);crunch(x);if(b.hp<=0)burstPinata(b);return true;
    case 'campfire':b.lit=!b.lit;if(!b.lit){const c=centroid(b);steam(c.x,c.y)}return true;
    case 'egg':hatch(b,false);return true;
    case 'bird':if(b.alive){b.sleep=false;birdCall(b);hop(b,rand(-1,1),-6);fx.push({t:'text',x:b.H.x,y:b.H.y-20,vy:-.6,life:.7,txt:'❗'})}return true;
  }
  return false;
}
function updateMachines(dt){
  for(const b of bodies){
    if(b.type==='cart'){
      const sp=((b.w1.x-b.w1.px)+(b.w2.x-b.w2.px))/2/dt;b.wa+=sp/11*dt;
      if(b.motor)for(const w of [b.w1,b.w2])if(w.touch){const[vx]=vel(w);if(vx*b.motor<7)addVel(w,b.motor*.32*dt,0)}
      if(b.motor&&frameNo%14===0)tone('sawtooth',70,75,.12,.012,null,b.w1.x);
    } else if(b.type==='fan'){
      if(!b.on)continue;b.ang+=.5*dt;
      const c=centroid(b),dir=b.dir;
      for(const p of allP){if(p.body===b||p.pinned)continue;const dx=(p.x-c.x)*dir,dy=p.y-c.y;if(dx<10||dx>380)continue;if(Math.abs(dy)>40+dx*.25)continue;
        const k=(1-dx/380)*.5*Math.min(1.6,p.area)*Math.min(1.2,p.im*1.3);addVel(p,dir*k*dt,-k*.15*dt)}
      if(Math.random()<.4*dt)fx.push({t:'wind',x:c.x+dir*20,y:c.y+rand(-18,18),vx:dir*rand(6,9),vy:0,life:.6});
      if(frameNo%10===0)noise(.2,.03,500,'bandpass',c.x,1);
    } else if(b.type==='rocket'&&b.fuel>0){
      b.fuel-=dt;const t=b.ps[0],bt=b.ps[3];let dx=t.x-bt.x,dy=t.y-bt.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
      for(const p of b.ps)addVel(p,dx*1.15*dt,dy*1.15*dt);
      addVel(t,rand(-.25,.25)*dt,0);
      for(let k=0;k<2;k++)fx.push({t:'flame',x:bt.x-dx*8+rand(-3,3),y:bt.y-dy*8+rand(-3,3),vx:-dx*rand(2,4)+rand(-.5,.5),vy:-dy*rand(2,4),life:.8,s:rand(5,8)});
      if(Math.random()<.5*dt)fx.push({t:'smoke',x:bt.x-dx*14,y:bt.y-dy*14,vx:-dx+rand(-.5,.5),vy:-dy+rand(-.5,.5),life:1,s:rand(8,14)});
      if(frameNo%6===0)noise(.15,.08,900,'lowpass',bt.x);
    } else if(b.type==='boat'){
      if(b.motor&&b.ps.some(p=>p.sub>.05)){const[vx]=vel(b.ps[0]);if(vx*b.motor<4.5)for(const p of b.ps)addVel(p,b.motor*.14*dt,0);
        if(Math.random()<.4*dt){const p=b.motor>0?b.ps[0]:b.ps[5];fx.push({t:'drop',x:p.x-b.motor*6,y:p.y+4,vx:-b.motor*rand(1,2),vy:-rand(.5,1.5),life:.6})}}
    } else if(b.type==='meteor'){
      const p=b.ps[0];for(let k=0;k<2;k++)fx.push({t:'flame',x:p.x+rand(-5,5),y:p.y+rand(-5,5),vx:rand(-.5,.5),vy:rand(-.5,.5),life:.9,s:rand(7,12)});
      if(Math.random()<.5)fx.push({t:'smoke',x:p.x,y:p.y,vx:0,vy:0,life:1,s:rand(8,14)});
    } else if(b.type==='firework'&&b.launched){
      const p=b.ps[0];b.burn-=dt;addVel(p,0,-(G+.9)*dt);addVel(p,-((p.x-p.px)/dt)*.05*dt,0);
      fx.push({t:'spark',x:p.x+rand(-2,2),y:p.y+8,vx:rand(-.6,.6),vy:rand(1,3),life:.5,col:'#ffcf6a'});
      if(b.burn<=0||p.y<40)burstFirework(b);
    }
  }
}

function rotateBody(b,da){
  if(b.type==='cannon'&&b.ps.length===4){aimCannon(b,da);return}
  const c=centroid(b),co=Math.cos(da),si=Math.sin(da);
  for(const p of b.ps){if(p.pinned&&b.type==='branch')continue;const dx=p.x-c.x,dy=p.y-c.y;p.x=c.x+dx*co-dy*si;p.y=c.y+dx*si+dy*co;p.px=p.x;p.py=p.y;p.lvx=p.lvy=0}
}
function scaleBody(b,k){

function cleanup(){

function centroid(b){let x=0,y=0;for(const p of b.ps){x+=p.x;y+=p.y}return{x:x/b.ps.length,y:y/b.ps.length}}

/* =================== WATER =================== */
function splashAt(pd,x,v,r){
  const i=clamp(Math.round((x-pd.x)/pd.w*pd.n),0,pd.n);
  for(let k=-2;k<=2;k++){const c=pd.cols[i+k];if(c)c.v+=v*.45*(1-Math.abs(k)*.3)}
  const n=Math.min(24,Math.round(v*1.2+r*.6));
  for(let k=0;k<n;k++)fx.push({t:'drop',x:x+rand(-r,r),y:groundY+4,vx:rand(-2.5,2.5),vy:-rand(2,Math.min(9,v*.7)),life:1});
  splash(x,Math.min(1,v/14));
}
function updatePonds(dt){
  for(const pd of ponds){
    const c=pd.cols;
    pd.ice=clamp((pd.ice||0)+(temp<0?dt/60/15:-dt/60/20),0,1);
    if(pd.ice>.6){for(const k of c){k.h*=.9;k.v=0}continue}
    for(const k of c){k.v+=(-k.h*.025-k.v*.03)*dt;k.h+=k.v*dt;k.h=clamp(k.h,-25,25)}
    for(let pass=0;pass<2;pass++)for(let i=1;i<c.length-1;i++){const d=(c[i-1].h+c[i+1].h-2*c[i].h)*.12*dt;c[i].v+=d}
    if(Math.abs(windNow)>1&&Math.random()<.3*dt){const k=c[(Math.random()*c.length)|0];k.v+=rand(-.3,.3)*Math.abs(windNow)*.15}
    if(S.weather!=='clear'&&Math.random()<.6*dt){const k=c[(Math.random()*c.length)|0];k.v+=rand(.2,.6)}
  }
}

/* =================== BIRD BRAIN =================== */
function nearestFood(p,maxD){

}

    const c={x:0,y:0};for(const p of half){c.x+=p.x/4;c.y+=p.y/4}
    const pl=add(rigid('plank',c.x,c.y,4,1,b.r,WOOD));
    const a=Math.atan2(half[3].y-half[0].y,half[3].x-half[0].x);
    pl.ps.forEach((p,i)=>{p.x=c.x+Math.cos(a)*(i-1.5)*2*b.r;p.y=c.y+Math.sin(a)*(i-1.5)*2*b.r;const[vx,vy]=vel(half[i]);p.px=p.x-vx*DT;p.py=p.y-vy*DT});
  }

function explode(x,y,R=170,F=24){
  for(const p of allP){
    if(p.body.dead)continue;
    const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy);if(d>R)continue;
    const k=1-d/R,b=p.body;
    if(b.type==='balloon'){popBalloon(b);continue}
    if(b.type==='firework'&&!b.launched){launchFirework(b)}
    if(b.type==='pinata'){burstPinata(b);continue}
    if(b.type==='tnt'&&!b.fuse)b.fuse=6+Math.random()*6;
    if(b.type==='melon'){breakMelon(b);continue}
    if(b.type==='glass'){shatterGlass(b);continue}
    if(b.type==='crate'&&k>.45){breakCrate(b);continue}
    if(b.type==='furn'&&k>.35)for(const g of Object.keys(b.anchor))breakJoint(b,g);
    if(b.type==='branch'&&k>.5&&!b.broken)breakBranch(b);
    addVel(p,dx/(d||1)*F*k,dy/(d||1)*F*k-5*k);
  }
  const hitB=new Set();
  for(const b of bodies){
    if(b.type!=='bird'||b.dead||hitB.has(b))continue;hitB.add(b);
    const d=Math.hypot(b.U.x-x,b.U.y-y);
    if(d<R*3)b.sleep=false;
    if(d>R)continue;const k=1-d/R;
    hurt(b,k*130,true);
    for(const limb of ['wing','leg1','leg2'])if(Math.random()<k*1.1-.25)breakLimb(b,limb);

  for(let i=0;i<16;i++)fx.push({t:'smoke',x:x+rand(-20,20),y:y+rand(-20,20),vx:rand(-2.5,2.5),vy:rand(-3,.5),life:1,s:rand(14,30)});
  for(let i=0;i<22;i++){const a=rand(0,TAU),v=rand(4,11);fx.push({t:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col:i%2?'#ffd23f':'#ff7b29'})}

}

function lightningStrike(){
  let x=rand(40,W-40),y=groundY;

  let best=null;for(const p of allP){if(Math.abs(p.x-x)<140&&p.y<y&&!p.body.dead&&p.body.type!=='balloon'){y=p.y;best=p}}
  for(const w of walls)if(x>w.x-40&&x<w.x+w.w+40&&w.y<y){y=w.y;x=clamp(x,w.x,w.x+w.w);best=null}

  const pts=[[x+rand(-60,60),0]];let cx=pts[0][0];
  for(let i=1;i<=10;i++){const t=i/10;cx=lerp(cx,x,.35)+rand(-18,18);pts.push([i===10?x:cx,y*t])}

  for(let i=0;i<14;i++)fx.push({t:'spark',x,y,vx:rand(-5,5),vy:rand(-6,0),life:1,col:'#fff7b0'});

}

let rainbow=0,prevWeather='clear';

  if(prevWeather!==S.weather){if((prevWeather==='rain'||prevWeather==='storm')&&S.weather==='clear'&&light>.5)rainbow=1;prevWeather=S.weather}
  rainbow=Math.max(0,rainbow-dt/60/45);
  overcast=lerp(overcast,S.weather==='clear'?0:S.weather==='rain'?.55:S.weather==='snow'?.6:S.weather==='sand'?.75:S.weather==='hail'?.8:1,.02*dt);
  const tTarget=S.weather==='snow'?-6:S.weather==='hail'?3:S.weather==='sand'?lerp(26,39,light):lerp(15,27,light)-(S.weather==='rain'?6:S.weather==='storm'?8:0);
  temp+=(tTarget-temp)*.006*dt;
  snowCover=clamp(snowCover+(S.weather==='snow'?dt/60/30:(temp>2?-dt/60/45:0)),0,1);
  // gusty wind, stronger in storms
  const gust=1+.35*Math.sin(simTime*.7)+.2*Math.sin(simTime*2.3+1)+(S.weather==='storm'?.5*Math.sin(simTime*5.1):0);
  windNow=S.wind*1.2*gust+(S.weather==='storm'?Math.sin(simTime*.37)*3:0)+(S.weather==='sand'?(S.wind<0?-1:1)*(8+3*Math.sin(simTime*1.3)):0);
  const want=S.weather==='clear'?0:Math.round(QUAL[S.quality].rain*(S.weather==='storm'?1.6:S.weather==='snow'?.7:S.weather==='hail'?.6:S.weather==='sand'?1.3:1)*Math.min(1,overcast*1.5));
  while(rainDrops.length<want)rainDrops.push({x:rand(-100,W+100),y:rand(-H,0),sz:rand(1.2,2.8),ph:rand(0,TAU)});
  if(rainDrops.length>want)rainDrops.length=want;
  for(const d of rainDrops){
    const snow=S.weather==='snow';
    if(S.weather==='sand'){d.x+=windNow*2.2*dt;d.y+=(.6+Math.sin(d.ph+simTime*3))*dt;if(d.x>W+60)d.x=-50;if(d.x<-60)d.x=W+50;if(d.y>groundY){d.y=rand(0,groundY)}continue}
    if(snow){d.y+=1.7*dt;d.x+=(windNow*.5+Math.sin(simTime*1.5+d.ph))*dt}else if(S.weather==='hail'){d.y+=11*dt;d.x+=windNow*.6*dt}else{d.y+=15*dt;d.x+=windNow*.9*dt}

  }

  if(b.type==='bird'){if(!(b.fire>0)&&b.alive){squawk(b.def.pitch*1.2,b.U.x);b.sleep=false}b.fire=1;return}
  if(b.type==='block'&&!(MATS[b.mat]&&MATS[b.mat].flam))return;

    case 'bomb':b.fuse=Math.min(b.fuse,40);return;
    case 'firework':launchFirework(b);return;
    case 'balloon':popBalloon(b);return;
    case 'rocket':launchRocket(b);return;
    case 'campfire':b.lit=true;return;
  }

function steam(x,y){for(let i=0;i<8;i++)fx.push({t:'smoke',x:x+rand(-10,10),y:y+rand(-6,6),vx:rand(-1,1),vy:-rand(1,2.5),life:.8,s:rand(6,12),col:'rgba(235,240,245,.6)'});if(okSnd('steam',150))noise(.5,.12,3500,'highpass',x)}

function updateFire(dt){

    if(b.type==='animal'){

      if(b.ps.some(p=>p.sub>.2)){b.fire=0;b.fireOut=simTime;steam(c.x,c.y);continue}
      b.fire-=sec*(wet?.45*wet:.18);if(b.fire<=0){b.fire=0;b.fireOut=simTime;continue}
      b.soot=Math.min(.85,(b.soot||0)+sec*.15);if(b.alive)hurtAnimal(b,sec*5);

      for(const p of b.ps)burning.push(p);crackle(c.x);continue;
    }
    if(b.type==='campfire'){
      if(!b.lit)continue;
      const c=centroid(b);
      if(b.ps.some(p=>p.sub>.3)||(wet&&Math.random()<.0015*wet*dt)){b.lit=false;steam(c.x,c.y);continue}
      if(Math.random()<1.1*dt)flame(c.x,c.y-6,1.2);
      if(Math.random()<.1*dt)fx.push({t:'ember',x:c.x,y:c.y-10,vx:rand(-.6,.6),vy:-rand(1,2),life:1});
      burning.push({x:c.x,y:c.y-8,r:12,body:b});crackle(c.x);continue;
    }
    if(!(b.fire>0))continue;
    if(b.ps.some(p=>p.sub>.3)){b.fire=0;const c=centroid(b);steam(c.x,c.y);continue}
    b.fire=wet?b.fire-sec*.32*wet:Math.min(1,b.fire+sec*.6); // rain and snow put fires out
    if(b.fire<=0){b.fire=0;const c=centroid(b);steam(c.x,c.y);continue}
    b.burnt=(b.burnt||0)+sec/14*b.fire;
    if(b.burnt>=1){burnUp(b);continue}
    if(Math.random()<b.fire*Math.min(3,b.ps.length*.25)*dt){const p=b.ps[(Math.random()*b.ps.length)|0];flame(p.x,p.y-p.r*.5,.6+b.fire*.6)}
    if(Math.random()<.04*dt){const p=b.ps[0];fx.push({t:'ember',x:p.x,y:p.y,vx:rand(-.6,.6),vy:-rand(1,2),life:1})}
    for(const p of b.ps)burning.push(p);
    crackle(b.ps[0].x);
  }
  for(const t of trees){
    if(!t.fire)continue;
    t.fire=wet?t.fire-sec*.2*wet:Math.min(1,t.fire+sec*.3);t.burnt=(t.burnt||0)+sec/30*Math.max(0,t.fire);
    if(t.fire<=0){t.fire=0;continue}
    const top=t.trunk.y;

    if(t.burnt<.8&&Math.random()<1.6*t.fire*dt)flame(t.x+rand(-55,55),top+rand(-40,25),1.3);
    for(const br of t.branches)if(!br.dead&&!br.fire&&Math.random()<.008*dt)ignite(br);
    for(let k=0;k<4;k++)burning.push({x:t.x,y:lerp(top,t.base??groundY,k/4),r:16});
    crackle(t.x);
    if(t.burnt>=1){for(let i=0;i<25;i++)fx.push({t:'crumb',x:t.x+rand(-30,30),y:rand(top,t.base??groundY),vx:rand(-1,1),vy:rand(-1,1),life:1,col:'#333'});woodCrack(t.x,1);removeTree(t.id)}
  }

      let hit=false;
      for(const p of b.ps){for(const q of burning){if(q.body===b)continue;if(Math.abs(p.x-q.x)<p.r+q.r+14&&Math.abs(p.y-q.y)<p.r+q.r+18){hit=true;break}}if(hit)break}

  }

  }
}

/* =================== FREEZE =================== */
function freezeBody(b){
  if(!b||b.dead||b.type==='branch'||b.type==='anchor'||b.frozenT>0)return;
  b.frozenT=15;b.fire=0;b.iceSt=[];b.oldFric=b.ps.map(p=>p.fric);
  const ps=b.ps.filter(p=>!p.pinned),n=ps.length;
  for(let i=0;i<n;i++)for(let j=i+1;j<n&&(n<=14||j<=i+4);j++){stick(b,ps[i],ps[j]);b.iceSt.push(b.st[b.st.length-1])}
  for(const p of b.ps)p.fric=.03;
  if(b.type==='bird'){b.flyT=0;b.goal=null;b.sleep=false;b.toyGo=null}
  const c=centroid(b);noise(.3,.25,6000,'highpass',c.x);tone('sine',2400,1800,.3,.04,1500,c.x);
}
function unfreeze(b,shatter){
  if(!(b.frozenT>0))return;b.frozenT=0;
  const set=new Set(b.iceSt||[]);b.st=b.st.filter(s=>!set.has(s));b.iceSt=null;
  b.ps.forEach((p,i)=>{if(b.oldFric&&b.oldFric[i]!==undefined)p.fric=b.oldFric[i]});
  const c=centroid(b);
  if(shatter){for(let i=0;i<14;i++)fx.push({t:'shardfx',x:c.x+rand(-15,15),y:c.y+rand(-15,15),vx:rand(-4,4),vy:rand(-5,1),rot:rand(0,TAU),vr:rand(-.3,.3),life:1});glassShatter(c.x)}
  else for(let i=0;i<8;i++)fx.push({t:'drop',x:c.x+rand(-15,15),y:c.y+rand(-10,10),vx:rand(-1,1),vy:rand(-1,0),life:.8});
  if(b.type==='bird'&&b.alive){b.stun=Math.max(b.stun,1.2);b.shiverT=5}
}
function updateFrozen(dt){
  const sec=dt/60;
  for(const b of bodies){if(!(b.frozenT>0))continue;
    let rate=temp<0?.3:1;
    if(burnList.length){const c=centroid(b);for(const q of burnList)if(Math.hypot(q.x-c.x,q.y-c.y)<90){rate=6;break}}
    b.frozenT-=sec*rate;if(b.frozenT<=0){b.frozenT=.001;unfreeze(b,false)}
  }
}

}

function makePlant(kind,x,base,o={}){
  x=clamp(x,24,W-24);
  const pl=Object.assign({kind,x,base,seed:Math.random()*1000,t:rand(5,12),walls:[]},o);
  const wall=w=>{w.plant=true;w.pl=pl;walls.push(w);pl.walls.push(w);return w};
  switch(kind){
    case 'flower':pl.cols=Array.from({length:3},()=>['#ff4d6d','#ffd23f','#b388ff','#ff8fab','#4cc9f0','#ffffff'][(Math.random()*6)|0]);pl.hts=[rand(24,34),rand(30,44),rand(22,32)];break;
    case 'sunflower':pl.h=rand(85,110);break;
    case 'berrybush':pl.berries=4;break;
    case 'appletree':{const t=makeTree(x,base);t.apple=true;pl.tree=t;pl.apples=Array.from({length:6},(_,i)=>({u:rand(-.5,.5),v:rand(-.6,.3),ripe:rand(0,1)}));break}
    case 'palm':pl.h=clamp(base-120,120,230);pl.lean=Math.random()<.5?-1:1;pl.nuts=3;
      wall({x:x-7,y:base-pl.h,w:14,h:pl.h,ptrunk:true});wall({x:x+pl.lean*18-18,y:base-pl.h-4,w:36,h:6,lampCap:true,ptop:true});break;
    case 'pine':pl.h=clamp(base-90,130,260);wall({x:x-7,y:base-pl.h*.55,w:14,h:pl.h*.55,ptrunk:true});break;
    case 'cactus':pl.h=rand(70,95);pl.arm=Math.random()<.5?-1:1;
      wall({x:x-10,y:base-pl.h,w:20,h:pl.h,cactus:true});wall({x:x+pl.arm*10+(pl.arm<0?-20:0),y:base-pl.h*.55,w:20,h:12,cactus:true});break;
    case 'mushroom':wall({x:x-7,y:base-38,w:14,h:38});wall({x:x-38,y:base-54,w:76,h:16,tramp:true,mush:true});break;
    case 'tallgrass':case 'reeds':break;
    case 'hoop':{const top=Math.max(60,base-175),d=x<W/2?1:-1;pl.top=top;pl.dir=d;pl.score=0;
      wall({x:x-4,y:top-34,w:8,h:base-top+34,ptrunk:true});
      wall({x:x+d*6-(d<0?6:0),y:top-46,w:6,h:56});
      pl.rx0=x+d*12;pl.rx1=x+d*56;
      wall({x:(d>0?pl.rx1:pl.rx1-6),y:top-3,w:6,h:6,rim:true});break}
  }
  plants.push(pl);return pl;
}
function removePlant(pl){
  walls=walls.filter(w=>w.pl!==pl);plants=plants.filter(p=>p!==pl);
  if(pl.tree)removeTree(pl.tree.id);
}
function deletePlantAt(x,y){
  for(const pl of [...plants].reverse()){
    const hgt=pl.kind==='palm'||pl.kind==='pine'?pl.h+40:pl.kind==='hoop'?pl.base-pl.top+60:pl.kind==='sunflower'?pl.h+20:pl.kind==='cactus'?pl.h:pl.kind==='appletree'?0:60;
    if(Math.abs(x-pl.x)<(pl.kind==='hoop'?60:30)&&y>pl.base-hgt&&y<pl.base+15){removePlant(pl);return true}
  }
  return false;
}

  switch(id){
    case 'flower':case 'sunflower':case 'berrybush':case 'appletree':case 'palm':case 'pine':case 'cactus':case 'mushroom':case 'tallgrass':case 'reeds':case 'hoop':

    case 'dominoes':{const base=surfaceAt(x,y),n=8,sp=26,x0=clamp(x-(n-1)*sp/2,20,W-20-(n-1)*sp);

      for(let i=0;i<n-1;i++){stick(b,b.ps[i],b.ps[i+1]);b.st[b.st.length-1].len*=1.04}

    case 'chain':{const y0=Math.min(y,groundY-60),b=newBody('chain');const a=new P(x,y0,4,b,{pinned:true,noCol:true});b.ps.push(a);
      for(let i=1;i<=14;i++)b.ps.push(new P(x,y0+i*8,3.6,b,{im:.8,fric:.4,dens:4}));
      for(let i=0;i<14;i++)stick(b,b.ps[i],b.ps[i+1]);add(b);tone('triangle',900,700,.15,.04,null,x);return undefined}
    case 'barrel':return add(rigid('barrel',x,y,2,3,9,{im:.6,fric:.5,dens:.55,rest:.1},{hp:100}));
    case 'tire':{const b=newBody('tire'),R=19,n=12;for(let i=0;i<n;i++){const a=i/n*TAU;b.ps.push(new P(x+Math.cos(a)*R,y+Math.sin(a)*R,5.5,b,{im:.9,fric:.9,rest:.55,dens:.5}))}
      for(let i=0;i<n;i++){stick(b,b.ps[i],b.ps[(i+1)%n]);stick(b,b.ps[i],b.ps[(i+2)%n],.6);stick(b,b.ps[i],b.ps[(i+n/2)%n],.12);stick(b,b.ps[i],b.ps[(i+3)%n],.2)}

    case 'jelly':{const b=rigid('jelly',x,y,3,3,8,{im:.9,fric:.6,rest:.3,dens:.9},{col:['#56d364','#ff6b9a','#ffb347','#7aa7ff'][(Math.random()*4)|0]});for(const s of b.st)s.k=.07;return add(b)}

    case 'beach':return S2('beach',24,{rest:.8,fric:.15,im:1.3,dens:.05,area:3},{rot:0});

function natureActivate(b,x,y){
  switch(b.type){
    case 'bucket':splashBucket(b);return true;
    case 'bubbler':b.on=!b.on;toast(b.on?'🫧 Bubbles on':'Bubbles off');tone('square',500,300,.08,.04,null,x);return true;
    case 'hab':b.burner=!b.burner;toast(b.burner?'🔥 Burner on — up we go!':'Burner off');noise(.4,.12,700,'lowpass',x);return true;
    case 'habenv':if(b.basket&&!b.basket.dead)return natureActivate(b.basket,x,y);return true;
    case 'chime':ringChime(b,true);addVel(b.ps[0],rand(-3,3),0);return true;
    case 'jelly':for(const p of b.ps)addVel(p,rand(-2,2),-rand(2,5));jiggle(x);return true;
    case 'domino':addVel(b.ps[0],x<centroid(b).x?2.5:-2.5,0);addVel(b.ps[1],x<centroid(b).x?2.5:-2.5,0);return true;
  }
  return false;
}
function ringChime(b,hard){if(simTime-(b.ringT||0)<.12)return;b.ringT=simTime;const f=[1568,1760,2093,2349,2637][b.note||0];
  tone('sine',f,f,1.4,hard?.05:.03,null,b.ps[0].x);tone('sine',f*2.76,f*2.76,.6,.008,null,b.ps[0].x)}
function jiggle(x){if(!okSnd('jig',90))return;tone('sine',220,420,.18,.05,180,x)}
function natureImpact(b,m){
  switch(b.type){
    case 'animal':animalImpact(b,m);return true;
    case 'block':return blockImpact(b,m);
    case 'coconut':if(m>10){crackCoconut(b);return true}if(m>4)woodKnock(b.ps[0].x,m);return true;
    case 'chime':if(m>1.2)ringChime(b,m>4);return true;
    case 'jelly':if(m>5)jiggle(centroid(b).x);return true;
    case 'barrel':if(m>16){b.hp-=(m-16)*6;woodKnock(centroid(b).x,m);if(b.hp<=0)breakCrate(b)}else if(m>9)woodKnock(centroid(b).x,m*.8);return true;
    case 'domino':if(m>2.5&&okSnd('dom',35))tone('triangle',1100+Math.random()*300,700,.05,.05,null,centroid(b).x);return true;
    case 'bowl':if(m>6)woodKnock(b.ps[0].x,m*1.8);return true;
    case 'tire':if(m>8&&okSnd('tire',120))tone('sine',140,90,.15,.06,null,centroid(b).x);return true;
    case 'pumpkin':if(m>19){b.dead=true;const p=b.ps[0];for(let i=0;i<4;i++){const c=add(single('chunk',p.x+rand(-8,8),p.y+rand(-8,8),8,{fric:.5,rest:.2,dens:.9},{edible:true,rot:rand(0,TAU),pump:true}));addVel(c.ps[0],rand(-4,4),-rand(1,5))}crunch(p.x)}return true;
  }
  return false;
}
function crackCoconut(b){
  if(b.dead)return;b.dead=true;const p=b.ps[0];
  for(let i=0;i<2;i++){const h=add(single('cochalf',p.x+(i?6:-6),p.y-2,7,{fric:.6,rest:.1,dens:.8},{edible:true,rot:i?0:Math.PI}));addVel(h.ps[0],(i?2:-2),-3)}

/* ---- extra contact physics: friction, bounce and resting ---- */
function pairResponse(dt){
  for(let i=0;i<pairs.length;i+=2){
    const a=pairs[i],b=pairs[i+1],dx=b.x-a.x,dy=b.y-a.y,mr=a.r+b.r+.6,d2=dx*dx+dy*dy;
    if(d2>=mr*mr||d2<1e-9)continue;
    const ab=a.body.type==='bird',bb=b.body.type==='bird';if((ab||a.body.type==='animal')&&(bb||b.body.type==='animal'))continue;
    const wa=(a.pinned||a.body.held)?0:a.im,wb=(b.pinned||b.body.held)?0:b.im,w=wa+wb;if(!w)continue;
    const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
    const rvx=(b.x-b.px)-(a.x-a.px),rvy=(b.y-b.py)-(a.y-a.py),vn=rvx*nx+rvy*ny;
    const v0n=((b.vx0-a.vx0)*nx+(b.vy0-a.vy0)*ny)*dt;
    let jn=0;
    if(v0n<-1.5*dt){let e=Math.max(a.rest,b.rest);if(ab||bb)e*=.3;const want=-v0n*e;if(vn<want)jn=want-vn}
    const tx=rvx-vn*nx,ty=rvy-vn*ny,k=Math.min(.9,Math.sqrt(a.fric*b.fric)*1.2);
    const ix=jn*nx-tx*k,iy=jn*ny-ty*k;
    a.px+=ix*wa/w;a.py+=iy*wa/w;b.px-=ix*wb/w;b.py-=iy*wb/w;
  }
}
const NOREST=new Set(['bird','branch','balloon','kite','hab','habenv','anchor','bell','chime','firework','rocket','cart','boat']);
function restDamp(dt){
  const th=.05*dt;
  for(const b of bodies){
    if(NOREST.has(b.type)||b.held||b.dragT||b.fire>0){b.restN=0;continue}
    let touching=false,slow=true;
    for(const p of b.ps){if(p.touch)touching=true;if(Math.abs(p.x-p.px)>th||Math.abs(p.y-p.py)>th){slow=false;break}}
    if(touching&&slow){b.restN=(b.restN||0)+1;if(b.restN>20)for(const p of b.ps){p.px=p.x;p.py=p.y}}else b.restN=0;
  }
}

function searchList(q){
  q=q.trim().toLowerCase();if(!q)return null;
  const all=[...BIRDS.map((d,i)=>({id:'bird:'+i,n:d.name,kind:'spawn',icon:icons&&icons[i],h:'Tap to place <b>'+d.name+'</b>'})),
    ...[...ANIMAL_TAB,...ITEMS,...PLANTS,...BUILD_TAB,...WORLD].map(it=>({kind:'spawn',...it})),...[...TOOLS,...POWERS].map(t=>({...t,kind:'tool'}))];
  return all.filter(it=>(it.n||'').toLowerCase().includes(q));
}

const undoStack=[];
function pushUndo(){
  try{undoStack.push(structuredClone({bodies,ropes,walls,ponds,trees,houses,mirrors,feeders,lamps,sprinklers,slings,portals,holes,tornados,waterDrops,plants,bubbles,butterflies,treeId,deaths,quakeT}));
    if(undoStack.length>30)undoStack.shift();}catch(e){console.warn('undo snapshot failed',e)}
  updUndo();
}
function updUndo(){const b=document.getElementById('bUndo');if(b)b.style.opacity=undoStack.length?1:.45}
function undo(){
  const s=undoStack.pop();updUndo();
  if(!s){toast('Nothing to undo');return}
  ({bodies,ropes,walls,ponds,trees,houses,mirrors,feeders,lamps,sprinklers,slings,portals,holes,tornados,waterDrops,plants,bubbles,butterflies,treeId,deaths,quakeT}=s);
  const fixDef=b=>{if(b.type==='animal'){b.def=ANIMALS[b.kind]||b.def;return}if(b.def){const d=BIRDS.find(x=>x.name===b.def.name);if(d)b.def=d}};
  for(const b of bodies)fixDef(b);for(const h of houses)for(const b of h.occ)fixDef(b);
  drags.clear();xform=null;tieA=null;inspected=null;holdTool=null;portalPending=null;wallDraw=null;pondDraw=null;fx=[];pairs=[];
  allP=[];for(const b of bodies)for(const p of b.ps)allP.push(p);

  for(const o of data.trees)makeTree(...XB(o));for(const o of data.houses||[])makeHouse(...XB(o));for(const o of data.mirrors||[]){const[x,b]=XB(o);mirrors.push({x,base:b})}for(const o of data.feeders||[])makeFeeder(...XB(o));for(const o of data.lamps||[])makeLamp(...XB(o));for(const o of data.sprinklers||[])makeSprinkler(...XB(o));for(const o of data.slings||[])makeSling(...XB(o));for(const pr of data.portals||[])portals.push(pr);
  natureLoad(data);
  for(const o of data.bodies){
    if(o.id==='seesaw'){add(makeSeesaw(o.x,o.y));continue}
    const b=spawn(o.id,o.x,o.y);if(!b||!b.ps)continue;
    if(o.f&&b.type==='bird')b.f=o.f;
    const c=centroid(b);for(const p of b.ps){p.x+=o.x-c.x;p.y+=o.y-c.y;p.px=p.x;p.py=p.y}
    if(o.sc&&o.sc!==1)scaleBody(b,o.sc);
    if(o.dead&&b.type==='bird'){b.alive=false;b.health=0}
    if(o.name)b.name=o.name;if(o.hat)b.hat=o.hat;if(o.paint!=null)b.paint=o.paint;
  }
  updateLight();syncUI();resize();toast('World loaded 📂');
}
$('bSave').onclick=saveWorld;$('bLoad').onclick=loadWorld;
$('bUndo').onclick=()=>{unlockAudio();undo()};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}});
$('bClear').onclick=()=>{pushUndo();butterflies=[];plants=[];bubbles=[];xform=null;inspected=null;houses=[];mirrors=[];feeders=[];lamps=[];sprinklers=[];slings=[];portals=[];portalPending=null;holes=[];tornados=[];waterDrops=[];quakeT=0;holdTool=null;bodies=[];ropes=[];walls=[];ponds=[];trees=[];fx=[];drags.clear();tieA=null;toast('Cleared')};

function panelH(){return document.getElementById('panel').offsetHeight}
function resize(){
  DPR=Math.min(QUAL[S.quality].dpr,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  groundY=H-panelH()-Math.min(70,H*.09);
  for(const pd of ponds)pd.d=Math.max(30,H-panelH()-groundY-8);
}
addEventListener('resize',resize);

function startScene(){
  const gy=groundY;
  makeTree(W*.1);
  makePond(W*.6,Math.min(240,W*.2));
  walls.push({x:W*.8,y:gy-150,w:Math.min(180,W*.15),h:16});
  for(let i=0;i<2;i++)add(rigid('crate',W*.26,gy-14-28*2*i-14,2,2,14,WOOD,{hp:100}));
  add(rigid('glass',W*.33,gy-26,1,5,5,{im:.9,fric:.25,dens:2.5,rest:.05},{cracked:0}));
  add(single('melon',W*.92,gy-30,22,{rest:.25,fric:.2,im:.6,dens:.95},{edible:true}));
  BIRDS.filter(d=>d.pet&&!d.extra).forEach((d,i)=>add(makeBird(d,W*.38+i*Math.min(48,W*.04)+(i>3?W*.25:0),gy-34*d.s,i%2?-1:1)));
  add(makeFurniture('table',W*.48,gy-30));
  add(makeBird(BIRDS[1],W*.8+40,gy-190,1));
  add(makeAnimal('vex',W*.2,gy-30,1));
}

let searchQ='';{const se=document.getElementById('search');se.oninput=()=>{searchQ=se.value;buildItems();itemsEl.scrollLeft=0};se.onkeydown=e=>{if(e.key==='Enter')se.blur()};se.addEventListener('pointerdown',e=>e.stopPropagation())}
$('bMap').onclick=()=>{unlockAudio();openMapMenu(false)};
buildItems();setHint();resize();{let m=null;try{m=localStorage.getItem('birdSandboxMap')}catch(e){}if(m&&MAPS[m]&&m!=='meadow'){loadMap(m,true);undoStack.length=0;updUndo()}else startScene()}syncUI();openMapMenu(true);
function updateLight(){const elev=Math.sin((tod-.25)*TAU);light=clamp(elev*2.2+.45,0,1)}
let last=performance.now(),uiT=0;
function frame(t){
  requestAnimationFrame(frame);
  const real=clamp((t-last)/16.667,.25,2);last=t;
  const sec=real/60;
  G=.55*S.grav;
  if(!paused){
    const dt=clamp(real*S.speed,.1,1.25);
    if(S.timeFlow)tod=(tod+dt/60/240)%1;
    updateWeather(dt,dt/60);updateWeatherExtras(dt);{const n=QUAL[S.quality].sub||1;for(let i=0;i<n;i++)step(dt/n,i>0)}updateFx(dt);
  } else {allP=[];for(const b of bodies)for(const p of b.ps)allP.push(p)}
  updateLight();updateAmbience(sec);
  render();
  uiT-=sec;if(uiT<0){uiT=.5;updateInfo();$('clock').textContent=(light<.25?'🌙 ':'☀️ ')+clockStr()+'  '+WICON[S.weather]+'  🌡️'+Math.round(temp)+'°C'+(Math.abs(windNow)>1?'  💨'+Math.abs(windNow).toFixed(0):'');if(setEl.classList.contains('open'))$('vTime').textContent=clockStr();if(S.timeFlow)syncUI()}
}
requestAnimationFrame(frame);
</script>
